# A performance-only MLPerf Endpoints point for WAN 2.2 T2V (wan-2.2-t2v-a14b):
# endpoints_point_wan22.yaml without the VBench dataset, for a point that
# carries no accuracy result (a submitter's-choice point).
#
#   CONCURRENCY=16 inference-endpoint benchmark from-config \
#       -c examples/09_Wan22_VideoGen_Example/endpoints_point_wan22_perf.yaml
#
# Per-point rules this config is shaped for:
#   - Issued samples are a whole multiple of the 248-prompt dataset (N_SAMPLES).
#   - Performance runs draw each prompt once per pass, without replacement
#     (see docs/t2v/README.md for the sample-order proposal to the WG).
#   - Seeds come from the Endpoints round via submission_ref, not from this file.
#   - stream_all_chunks is set (6.5 permits either value); it has no effect on
#     the non-streaming videogen adapter.
#   - model_params.streaming is off: the videogen adapter cannot stream, so the
#     6.5 / 9.1 streaming check flags these points until the rules exempt
#     non-streaming responses.

name: "endpoints-wan22-perf-c${CONCURRENCY}"
version: "1.0"
type: "submission"
benchmark_mode: "online" # required for type: submission

# Binds the run to the published Endpoints seed set. model names the benchmark;
# model_params.name below stays the served model name.
submission_ref:
  model: "wan-2.2-t2v-a14b"
  ruleset: "mlperf-endpoints-v1.0-2026-10-C1-A"

model_params:
  name: "${SERVED_MODEL:-wan22}"
  max_new_tokens: 1 # ignored by VideoGenAdapter
  streaming: "off" # WAN 2.2 uses non-streaming HTTP POST/response

datasets:
  - name: wan22_perf
    path: examples/09_Wan22_VideoGen_Example/wan22_prompts.jsonl
    type: "performance" # all 248 prompts

settings:
  runtime:
    # A multiple of 248 (6.4): N_SAMPLES / 248 passes over every prompt.
    n_samples_to_issue: "${N_SAMPLES:-248}"
    # Runaway guard only, well above the expected run time. The 6.2 minimum
    # duration (600 s at concurrency 1-32, 1200 s above) is met by count: size
    # N_SAMPLES so the run lasts at least that long (README.md uses 496 above
    # 32). A binding cap would stop the point short of N_SAMPLES (6.4).
    max_issue_duration_ms: 10800000 # 3 hours

  load_pattern:
    type: "concurrency"
    target_concurrency: "${CONCURRENCY}"

  client:
    stream_all_chunks: true

endpoint_config:
  endpoints:
    - "${ENDPOINT:-http://localhost:8000}"
  api_type: "videogen"
  api_key: null

report_dir: "logs/wan22_endpoints/perf_c${CONCURRENCY}"
